<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        #chat {
            min-height: 300px;
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        input {
            width: 70%;
            padding: 12px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 18px;
            cursor: pointer;
        }

        .user {
            margin: 10px 0;
            font-weight: bold;
        }

        .assistant {
            margin: 10px 0;
        }
    </style>
</head>

<body>

    <h1>🤖 My Personal Assistant</h1>

    <div id="chat"></div>

    <input
        id="message"
        type="text"
        placeholder="Ask me anything..."
    >

    <button onclick="sendMessage()">Send</button>

    <script>
        async function sendMessage() {
            const input = document.getElementById("message");
            const chat = document.getElementById("chat");

            const message = input.value.trim();

            if (!message) return;

            chat.innerHTML += `<div class="user">You: ${message}</div>`;

            input.value = "";

            chat.innerHTML += `<div class="assistant" id="loading">🤔 Thinking...</div>`;

            try {
                const response = await fetch("https://YOUR-VERCEL-DOMAIN.vercel.app/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: message
                    })
                });

                const data = await response.json();

                document.getElementById("loading").remove();

                if (data.reply) {
                    chat.innerHTML += `<div class="assistant">🤖 ${data.reply}</div>`;
                } else {
                    chat.innerHTML += `<div class="assistant">❌ ${data.error || "Something went wrong."}</div>`;
                }

            } catch (error) {
                document.getElementById("loading").remove();

                chat.innerHTML += `<div class="assistant">❌ Could not connect to the assistant.</div>`;
            }
        }
    </script>
</body>
</html>
